name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, test, lint, format
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          # Only main writes the cache; PRs read it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Check
        run: ./gradlew spotlessCheck assembleDebug testDebugUnitTest lint --continue

      # validateDebugScreenshotTest is added here with the screenshot setup (#4).

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 14
