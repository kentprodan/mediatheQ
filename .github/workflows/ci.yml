name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, test, lint, format
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          # Only main writes the cache; PRs read it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Check
        # A private repository runner has about 7 GB: two workers, and Kotlin compiles inside the Gradle daemon
        # (a separate Kotlin daemon takes its own 4 GB heap; the runner was starved and lost).
        run: ./gradlew --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process spotlessCheck assembleDebug :baselineprofile:assembleBenchmarkRelease :app:assembleDaily :app-tv:assembleDaily testDebugUnitTest validateDebugScreenshotTest lint --continue

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 14
