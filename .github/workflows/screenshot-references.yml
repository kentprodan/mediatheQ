# Regenerates screenshot references on Linux, the canonical rendering environment (ADR 0007).
# Download the artifact and commit the images that changed on purpose.
name: Regenerate screenshot references

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # Works once the screenshot plugin is set up (#4).
      - name: Update references
        run: ./gradlew updateDebugScreenshotTest

      - name: Upload references
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-references
          path: '**/src/screenshotTestDebug/reference/'
