// Types Compose should treat as stable although they come from modules it does not compile (#505).
// Only immutable value types belong here: data classes of vals and read-only collections that are never mutated.
// Marking a mutable type stable would hide recompositions and show stale UI.

// The domain model: immutable data classes, sealed types and enums.
